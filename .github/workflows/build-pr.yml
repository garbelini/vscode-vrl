name: Build and Test PR

on:
    pull_request:
        branches: [main, master]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18.20.0'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint

            - name: Run tests
              run: npm run test:headless

            - name: Build extension
              run: npm run package

            - name: Find VSIX file
              id: find-vsix
              run: |
                  if ls *.vsix 1> /dev/null 2>&1; then
                      VSIX_FILE=$(ls *.vsix | head -n1)
                      echo "vsix-file=$VSIX_FILE" >> $GITHUB_OUTPUT
                      echo "Found VSIX file: $VSIX_FILE"
                  else
                      echo "No VSIX file found"
                      exit 1
                  fi

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: vscode-vrl-extension
                  path: '*.vsix'
                  retention-days: 30

            - name: Comment on PR with artifact info
              uses: actions/github-script@v7
              with:
                  script: |
                      const comment = `🎉 **Build successful!**

                      The VSCode extension has been built and is ready for testing.

                      📦 **Download the extension**: Go to the "Actions" tab above, find this workflow run, and download the \`vscode-vrl-extension\` artifact.

                      To install manually:
                      1. Download the artifact from the Actions tab
                      2. Extract the .vsix file from the zip
                      3. Run \`code --install-extension path/to/file.vsix\` or use VSCode's "Install from VSIX" command

                      Build details:
                      - ✅ Linting passed
                      - ✅ Tests passed  
                      - ✅ Extension packaged successfully`;

                      await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });
